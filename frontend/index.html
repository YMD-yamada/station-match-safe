<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>駅のみマッチ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f4f6fb;
        --surface: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --primary: #4f46e5;
        --primary-ink: #eef2ff;
        --accent: #ec4899;
        --success: #059669;
        --danger: #dc2626;
        --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
        --radius: 18px;
        --nav-h: 64px;
        --safe-b: env(safe-area-inset-bottom, 0px);
        font-family: "DM Sans", "Noto Sans JP", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--text);
        background: radial-gradient(1200px 600px at 10% -10%, #eef2ff 0%, transparent 55%), var(--bg);
        min-height: 100dvh;
      }
      .app-header {
        position: sticky;
        top: 0;
        z-index: 30;
        backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.82);
        border-bottom: 1px solid var(--line);
        padding: 14px 16px 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .brand h1 {
        margin: 0;
        font-size: 17px;
        letter-spacing: -0.02em;
      }
      .brand small {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
      }
      .pill-btn {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      main.shell {
        max-width: 520px;
        margin: 0 auto;
        padding: 12px 14px calc(var(--nav-h) + var(--safe-b) + 18px);
      }
      .screen { display: none; animation: fade 0.22s ease; }
      .screen.active { display: block; }
      @keyframes fade {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .hero {
        padding: 18px 4px 8px;
      }
      .hero h2 {
        margin: 0 0 8px;
        font-size: 26px;
        letter-spacing: -0.03em;
        line-height: 1.25;
      }
      .hero p {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
        font-size: 14px;
      }
      .card {
        background: var(--surface);
        border-radius: var(--radius);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: var(--shadow);
        padding: 14px;
      }
      label.lbl {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin: 10px 0 6px;
      }
      input, select, textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 11px 12px;
        font-size: 14px;
        outline: none;
        background: #fff;
      }
      textarea { min-height: 84px; resize: vertical; }
      .primary {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 13px 14px;
        font-weight: 700;
        font-size: 15px;
        color: #fff;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        cursor: pointer;
        margin-top: 12px;
      }
      .ghost {
        width: 100%;
        border: 1px dashed var(--line);
        border-radius: 14px;
        padding: 12px;
        font-weight: 600;
        background: transparent;
        cursor: pointer;
        color: var(--muted);
      }
      .chip-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 11px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        background: #fff;
        color: var(--muted);
      }
      .chip.on {
        border-color: rgba(79, 70, 229, 0.35);
        background: var(--primary-ink);
        color: var(--primary);
      }
      .disc-bar {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 6px;
        margin: 6px 0 12px;
        scrollbar-width: none;
      }
      .disc-bar::-webkit-scrollbar { display: none; }
      .user-card {
        border-radius: var(--radius);
        border: 1px solid rgba(226, 232, 240, 0.95);
        overflow: hidden;
        background: var(--surface);
        margin-bottom: 12px;
      }
      .user-card .banner {
        height: 108px;
        background: linear-gradient(135deg, #c7d2fe, #fbcfe8);
      }
      .user-card .body { padding: 12px 14px 14px; position: relative; }
      .avatar {
        width: 74px;
        height: 74px;
        border-radius: 22px;
        margin-top: -46px;
        background: #fff;
        border: 3px solid #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 26px;
        color: var(--primary);
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.12);
      }
      .title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin-top: 8px;
      }
      .title-row h3 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.02em;
      }
      .age {
        color: var(--muted);
        font-weight: 600;
        font-size: 13px;
      }
      .bio {
        margin: 8px 0 0;
        color: var(--text);
        font-size: 14px;
        line-height: 1.55;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .tag {
        font-size: 12px;
        font-weight: 600;
        padding: 5px 9px;
        border-radius: 999px;
        background: #f8fafc;
        border: 1px solid var(--line);
        color: #334155;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px;
      }
      .btn-outline {
        border-radius: 14px;
        padding: 11px 12px;
        font-weight: 700;
        border: 1px solid var(--line);
        background: #fff;
        cursor: pointer;
      }
      .btn-like {
        border-radius: 14px;
        padding: 11px 12px;
        font-weight: 800;
        border: none;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #ec4899, #f97316);
      }
      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 8px 0 12px;
      }
      .tab {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 14px;
        padding: 10px 8px;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
        color: var(--muted);
      }
      .tab.on {
        border-color: rgba(79, 70, 229, 0.35);
        background: var(--primary-ink);
        color: var(--primary);
      }
      .thread-item {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: #fff;
        margin-bottom: 10px;
        cursor: pointer;
      }
      .mini-ava {
        width: 46px;
        height: 46px;
        border-radius: 15px;
        display: grid;
        place-items: center;
        font-weight: 800;
        color: var(--primary);
        background: var(--primary-ink);
      }
      .thread-meta h4 { margin: 0; font-size: 14px; }
      .thread-meta p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
      .badge {
        margin-left: auto;
        font-size: 11px;
        font-weight: 800;
        padding: 5px 8px;
        border-radius: 999px;
        background: #ecfdf5;
        color: var(--success);
      }
      .badge.warn {
        background: #fff7ed;
        color: #c2410c;
      }
      .bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 40;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(14px);
        border-top: 1px solid var(--line);
        padding: 8px 10px calc(8px + var(--safe-b));
      }
      .nav-inner {
        max-width: 520px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .nav-btn {
        border: none;
        background: transparent;
        padding: 8px 6px;
        border-radius: 14px;
        cursor: pointer;
        color: var(--muted);
        font-weight: 700;
        font-size: 11px;
      }
      .nav-btn.on {
        color: var(--primary);
        background: var(--primary-ink);
      }
      .nav-btn span {
        display: block;
        font-size: 18px;
        margin-bottom: 2px;
      }
      .sheet-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.45);
        z-index: 60;
        display: none;
      }
      .sheet-overlay.show { display: block; }
      .sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 70;
        background: #fff;
        border-top-left-radius: 22px;
        border-top-right-radius: 22px;
        padding: 14px 16px calc(18px + var(--safe-b));
        transform: translateY(110%);
        transition: transform 0.22s ease;
        max-height: 78dvh;
        overflow: auto;
      }
      .sheet.show { transform: translateY(0); }
      .sheet h3 { margin: 6px 0 10px; font-size: 16px; }
      .toast {
        position: fixed;
        left: 14px;
        right: 14px;
        bottom: calc(var(--nav-h) + var(--safe-b) + 14px);
        z-index: 80;
        background: #0f172a;
        color: #fff;
        padding: 12px 14px;
        border-radius: 14px;
        font-size: 13px;
        display: none;
        box-shadow: var(--shadow);
      }
      .toast.show { display: block; }
      .chat-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 10px;
      }
      .chat-msgs {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 52dvh;
        overflow: auto;
        padding-right: 4px;
      }
      .bubble {
        max-width: 86%;
        padding: 10px 12px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.45;
      }
      .bubble.me {
        align-self: flex-end;
        background: var(--primary-ink);
        border: 1px solid rgba(79, 70, 229, 0.25);
      }
      .bubble.them {
        align-self: flex-start;
        background: #f8fafc;
        border: 1px solid var(--line);
      }
      .empty {
        text-align: center;
        padding: 28px 12px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      .kv {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 8px 12px;
        font-size: 13px;
        margin-top: 10px;
      }
      .kv span { color: var(--muted); font-weight: 600; }
      .legal {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.55;
        margin-top: 10px;
      }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      body.no-nav .bottom-nav { display: none; }
      body.no-nav .shell { padding-bottom: 22px; }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <div>
          <h1>駅のみマッチ</h1>
          <small id="subTitle">高崎線・駅近だけに絞ったマッチング</small>
        </div>
        <button type="button" class="pill-btn" id="btnSafety">安全について</button>
      </div>
    </header>

    <main class="shell">
      <section id="screen-onboarding" class="screen">
        <div class="hero">
          <h2>駅でつながる、<br />やさしい始め方。</h2>
          <p>20歳以上限定。双方の同意があるまで連絡先は不要です。まずは駅と短時間の飲みから。</p>
        </div>
        <div class="card">
          <label class="lbl">ニックネーム</label>
          <input id="regNick" maxlength="80" placeholder="例: ゆうこ" autocomplete="nickname" />

          <label class="lbl">メール（ログイン用途・公開されません）</label>
          <input id="regMail" type="email" placeholder="you@example.com" autocomplete="email" />

          <label class="lbl">年齢</label>
          <input id="regAge" type="number" min="20" max="99" placeholder="20以上" inputmode="numeric" />

          <label class="lbl">ひとこと（任意）</label>
          <textarea id="regBio" maxlength="500" placeholder="よく行く時間帯や、駅周りでゆったり派など"></textarea>

          <label class="lbl">趣味タグ（カンマ区切り）</label>
          <input id="regHobby" placeholder="ジャズ,ランニング,ダンス" />

          <label class="lbl">よく使う駅（カンマ区切り）</label>
          <input id="regSta" placeholder="熊谷,深谷,本庄" />

          <label class="lbl">飲みスタイル</label>
          <select id="regDrink">
            <option value="casual">カジュアルに一杯</option>
            <option value="quiet">落ち着いたお店</option>
            <option value="lively">にぎやかなお店</option>
          </select>

          <button type="button" class="primary" id="btnRegister">はじめる</button>
          <button type="button" class="ghost" id="btnResume">保存済みのユーザーIDで続ける</button>
        </div>
        <p class="legal">利用により安全ポリシーに同意したものとみなします。架空プロフィールは禁止です。</p>
      </section>

      <section id="screen-discover" class="screen">
        <div class="disc-bar" id="stationFilters"></div>
        <div id="discoverList"></div>
      </section>

      <section id="screen-connections" class="screen">
        <div class="tabs" role="tablist">
          <button type="button" class="tab on" data-tab="in">届いた</button>
          <button type="button" class="tab" data-tab="out">送った</button>
          <button type="button" class="tab" data-tab="ok">マッチ</button>
        </div>
        <div id="connPanels"></div>
      </section>

      <section id="screen-chats" class="screen">
        <div id="chatList"></div>
      </section>

      <section id="screen-me" class="screen">
        <div class="card">
          <div style="display:flex; gap:12px; align-items:center;">
            <div class="avatar" id="meAvatar">?</div>
            <div>
              <div style="font-weight:800; font-size:18px;" id="meNick">ゲスト</div>
              <div style="color:var(--muted); font-size:13px; font-weight:600;">ユーザーID <span id="meId">—</span></div>
            </div>
          </div>
          <div class="kv">
            <span>メール</span><div id="meMail">—</div>
            <span>飲みスタイル</span><div id="meDrink">—</div>
          </div>
          <button type="button" class="btn-outline" id="btnLogout" style="margin-top:12px;">ログアウト（この端末の保存を消す）</button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="メインメニュー">
      <div class="nav-inner">
        <button type="button" class="nav-btn on" data-go="discover"><span>🔎</span>さがす</button>
        <button type="button" class="nav-btn" data-go="connections"><span>💞</span>つながり</button>
        <button type="button" class="nav-btn" data-go="chats"><span>💬</span>チャット</button>
        <button type="button" class="nav-btn" data-go="me"><span>👤</span>マイページ</button>
      </div>
    </nav>

    <div class="sheet-overlay" id="sheetBackdrop"></div>
    <div class="sheet" id="stationSheet" role="dialog" aria-modal="true">
      <h3>待ち合わせはどの駅？</h3>
      <p style="margin:0 0 10px; color:var(--muted); font-size:13px; line-height:1.5;">相手が承認するとチャットが開きます。初回は駅前・人通りのある時間帯を推奨します。</p>
      <label class="lbl">駅</label>
      <select id="pickStation"></select>
      <button type="button" class="primary" id="btnSendLike">招待を送る</button>
      <button type="button" class="ghost" id="btnCloseSheet" style="margin-top:8px;">キャンセル</button>
    </div>

    <div class="sheet" id="chatSheet" role="dialog" aria-modal="true">
      <div class="chat-head">
        <button type="button" class="btn-outline" id="btnCloseChat" style="width:auto; padding:8px 10px;">戻る</button>
        <div style="flex:1;">
          <div style="font-weight:800;" id="chatTitle">チャット</div>
          <div style="font-size:12px; color:var(--muted); font-weight:600;" id="chatSub">駅マッチ</div>
        </div>
      </div>
      <div class="chat-msgs" id="chatMsgs"></div>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <input id="chatInput" placeholder="メッセージ" maxlength="800" />
        <button type="button" class="primary" id="btnSendChat" style="width:auto; margin:0; padding:11px 14px;">送信</button>
      </div>
    </div>

    <div class="sheet" id="policySheet" role="dialog" aria-modal="true">
      <h3>安全ポリシー</h3>
      <pre id="policyBody" style="white-space:pre-wrap; font-size:13px; color:#334155; line-height:1.55; margin:0;"></pre>
      <button type="button" class="primary" id="btnClosePolicy">閉じる</button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const LS_UID = "sm_uid";
      const LS_NICK = "sm_nick";
      const stations = ["上尾","北上尾","桶川","北本","鴻巣","北鴻巣","吹上","行田","熊谷","籠原","深谷","岡部","本庄"];

      let state = {
        uid: null,
        nickname: "",
        filterStation: "",
        pickTarget: null,
        activeChat: null,
      };

      function toast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(window.__toastT);
        window.__toastT = setTimeout(() => el.classList.remove("show"), 2600);
      }

      async function api(path, opts = {}) {
        const res = await fetch(path, {
          ...opts,
          headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
        });
        let data = null;
        try { data = await res.json(); } catch (_) {}
        if (!res.ok) {
          const detail = data && data.detail;
          const msg =
            typeof detail === "string"
              ? detail
              : detail && detail.message
              ? detail.message
              : `エラー (${res.status})`;
          throw new Error(msg);
        }
        return data;
      }

      function showScreen(name) {
        document.body.classList.toggle("no-nav", name === "onboarding");
        document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
        const map = {
          onboarding: "screen-onboarding",
          discover: "screen-discover",
          connections: "screen-connections",
          chats: "screen-chats",
          me: "screen-me",
        };
        document.getElementById(map[name]).classList.add("active");
        document.querySelectorAll(".nav-btn").forEach((b) => {
          b.classList.toggle("on", b.dataset.go === name);
        });
        const sub = document.getElementById("subTitle");
        sub.textContent =
          name === "discover"
            ? "駅でフィルタして、気になる人に招待を送る"
            : name === "connections"
            ? "届いた申請の承認・辞退はここから"
            : name === "chats"
            ? "マッチ後のみチャットできます"
            : name === "me"
            ? "プロフィールとログアウト"
            : "高崎線・駅近だけに絞ったマッチング";
      }

      function navTo(go) {
        if (!state.uid) {
          toast("先にプロフィール登録を完了してください");
          showScreen("onboarding");
          return;
        }
        showScreen(go);
        if (go === "discover") loadDiscover();
        if (go === "connections") loadConnections();
        if (go === "chats") loadChats();
        if (go === "me") loadMe();
      }

      function initials(name) {
        const s = (name || "?").trim();
        return s.slice(0, 1).toUpperCase();
      }

      function renderStationFilters() {
        const row = document.getElementById("stationFilters");
        row.innerHTML = "";
        const all = document.createElement("button");
        all.type = "button";
        all.className = "chip on";
        all.textContent = "すべて";
        all.addEventListener("click", () => {
          state.filterStation = "";
          [...row.querySelectorAll(".chip")].forEach((c) => c.classList.remove("on"));
          all.classList.add("on");
          loadDiscover();
        });
        row.appendChild(all);
        stations.forEach((st) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "chip";
          b.textContent = st;
          b.addEventListener("click", () => {
            state.filterStation = st;
            [...row.querySelectorAll(".chip")].forEach((c) => c.classList.remove("on"));
            b.classList.add("on");
            loadDiscover();
          });
          row.appendChild(b);
        });
      }

      async function loadDiscover() {
        const box = document.getElementById("discoverList");
        if (!state.uid) return;
        box.innerHTML = `<div class="empty">読み込み中…</div>`;
        try {
          const qs = new URLSearchParams({ me: String(state.uid) });
          if (state.filterStation) qs.set("station", state.filterStation);
          const data = await api(`/discover/users?${qs.toString()}`, { method: "GET" });
          if (!data.items.length) {
            box.innerHTML = `<div class="empty">この条件ではまだユーザーが見つかりません。<br />駅フィルタを変えるか、あとでもう一度試してください。</div>`;
            return;
          }
          box.innerHTML = "";
          data.items.forEach((u) => {
            const card = document.createElement("article");
            card.className = "user-card";
            card.innerHTML = `
              <div class="banner"></div>
              <div class="body">
                <div class="avatar">${initials(u.nickname)}</div>
                <div class="title-row">
                  <h3>${escapeHtml(u.nickname)}</h3>
                  <div class="age">${u.age}歳</div>
                </div>
                <p class="bio">${escapeHtml(u.public_bio || "よろしくお願いします")}</p>
                <div class="tags">
                  ${(u.hobbies || []).slice(0, 6).map((h) => `<span class="tag">${escapeHtml(h)}</span>`).join("")}
                  ${(u.preferred_stations || []).slice(0, 4).map((s) => `<span class="tag">${escapeHtml(s)}</span>`).join("")}
                </div>
                <div class="actions">
                  <button type="button" class="btn-outline" data-skip="${u.id}">スキップ</button>
                  <button type="button" class="btn-like" data-like="${u.id}">駅でつながる</button>
                </div>
              </div>`;
            card.querySelector("[data-skip]").addEventListener("click", () => {
              card.style.opacity = "0.55";
              toast("スキップしました（一覧更新で再表示できます）");
            });
            card.querySelector("[data-like]").addEventListener("click", () => openStationSheet(u));
            box.appendChild(card);
          });
        } catch (e) {
          box.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
        }
      }

      function openStationSheet(user) {
        state.pickTarget = user;
        const sel = document.getElementById("pickStation");
        sel.innerHTML = stations.map((s) => `<option value="${s}">${s}</option>`).join("");
        const preferred = user.preferred_stations || [];
        const first = preferred.find((x) => stations.includes(x)) || state.filterStation || "熊谷";
        sel.value = stations.includes(first) ? first : "熊谷";
        document.getElementById("sheetBackdrop").classList.add("show");
        document.getElementById("stationSheet").classList.add("show");
      }

      function closeSheets() {
        document.getElementById("sheetBackdrop").classList.remove("show");
        document.getElementById("stationSheet").classList.remove("show");
        document.getElementById("chatSheet").classList.remove("show");
        document.getElementById("policySheet").classList.remove("show");
      }

      async function sendInvite() {
        if (!state.pickTarget) return;
        const st = document.getElementById("pickStation").value;
        try {
          await api("/matches", {
            method: "POST",
            body: JSON.stringify({
              requester_id: state.uid,
              target_user_id: state.pickTarget.id,
              selected_station: st,
            }),
          });
          toast("招待を送りました");
          closeSheets();
          loadDiscover();
          navTo("connections");
        } catch (e) {
          toast(e.message);
        }
      }

      function partitionMatches(items) {
        const incoming = items.filter((x) => x.role === "target" && x.status === "requested");
        const outgoing = items.filter((x) => x.role === "requester" && x.status === "requested");
        const matched = items.filter((x) => x.status === "accepted");
        return { incoming, outgoing, matched };
      }

      let connTab = "in";

      async function loadConnections() {
        const root = document.getElementById("connPanels");
        root.innerHTML = `<div class="empty">読み込み中…</div>`;
        try {
          const data = await api(`/matches/mine?user_id=${encodeURIComponent(String(state.uid))}`, { method: "GET" });
          const p = partitionMatches(data.items || []);
          root.innerHTML = "";
          const panels = {
            in: renderMatchList(p.incoming, "incoming"),
            out: renderMatchList(p.outgoing, "outgoing"),
            ok: renderMatchList(p.matched, "matched"),
          };
          root.appendChild(panels[connTab]);
          document.querySelectorAll(".tab").forEach((t) => {
            t.classList.toggle("on", t.dataset.tab === connTab);
          });
        } catch (e) {
          root.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
        }
      }

      function renderMatchList(rows, kind) {
        const div = document.createElement("div");
        if (!rows.length) {
          div.innerHTML = `<div class="empty">該当する項目はありません。</div>`;
          return div;
        }
        rows.forEach((row) => {
          const item = document.createElement("div");
          item.className = "thread-item";
          const o = row.other || {};
          item.innerHTML = `
            <div class="mini-ava">${initials(o.nickname)}</div>
            <div class="thread-meta" style="flex:1;">
              <h4>${escapeHtml(o.nickname || "")}</h4>
              <p>${escapeHtml(row.selected_station || "")}駅 · ${escapeHtml(row.status)}</p>
            </div>
          `;
          if (kind === "incoming") {
            const badge = document.createElement("div");
            badge.className = "badge warn";
            badge.textContent = "要返答";
            item.appendChild(badge);
            item.addEventListener("click", () => openDecision(row));
          }
          if (kind === "outgoing") {
            const badge = document.createElement("div");
            badge.className = "badge warn";
            badge.textContent = "承認待ち";
            item.appendChild(badge);
          }
          if (kind === "matched") {
            const badge = document.createElement("div");
            badge.className = "badge";
            badge.textContent = "チャット可";
            item.appendChild(badge);
            item.addEventListener("click", () => openChatThread(row));
          }
          div.appendChild(item);
        });
        return div;
      }

      async function openDecision(row) {
        const ok = confirm(`${row.other.nickname}さんからの招待を承認しますか？`);
        try {
          await api(`/matches/${row.match_id}/decision`, {
            method: "POST",
            body: JSON.stringify({ actor_user_id: state.uid, action: ok ? "accept" : "decline" }),
          });
          toast(ok ? "承認しました" : "辞退しました");
          loadConnections();
          loadChats();
        } catch (e) {
          toast(e.message);
        }
      }

      async function loadChats() {
        const box = document.getElementById("chatList");
        box.innerHTML = `<div class="empty">読み込み中…</div>`;
        try {
          const data = await api(`/matches/mine?user_id=${encodeURIComponent(String(state.uid))}`, { method: "GET" });
          const matched = (data.items || []).filter((x) => x.status === "accepted");
          if (!matched.length) {
            box.innerHTML = `<div class="empty">マッチが成立するとチャットが利用できます。<br />まずは「さがす」から招待を送ってみましょう。</div>`;
            return;
          }
          box.innerHTML = "";
          matched.forEach((row) => {
            const o = row.other || {};
            const item = document.createElement("div");
            item.className = "thread-item";
            item.innerHTML = `
              <div class="mini-ava">${initials(o.nickname)}</div>
              <div class="thread-meta">
                <h4>${escapeHtml(o.nickname || "")}</h4>
                <p>${escapeHtml(row.selected_station || "")}駅でつながり済み</p>
              </div>
              <div class="badge">開く</div>`;
            item.addEventListener("click", () => openChatThread(row));
            box.appendChild(item);
          });
        } catch (e) {
          box.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
        }
      }

      async function openChatThread(row) {
        state.activeChat = row;
        document.getElementById("chatTitle").textContent = row.other?.nickname || "チャット";
        document.getElementById("chatSub").textContent = `${row.selected_station}駅マッチ`;
        document.getElementById("sheetBackdrop").classList.add("show");
        document.getElementById("chatSheet").classList.add("show");
        await refreshMessages();
      }

      async function refreshMessages() {
        const row = state.activeChat;
        if (!row) return;
        const box = document.getElementById("chatMsgs");
        box.innerHTML = `<div class="empty">読み込み中…</div>`;
        try {
          const data = await api(
            `/matches/${row.match_id}/messages?actor_user_id=${encodeURIComponent(String(state.uid))}`,
            { method: "GET" },
          );
          box.innerHTML = "";
          (data.items || []).forEach((m) => {
            const bubble = document.createElement("div");
            bubble.className = "bubble " + (m.sender_id === state.uid ? "me" : "them");
            bubble.textContent = m.message;
            box.appendChild(bubble);
          });
          box.scrollTop = box.scrollHeight;
        } catch (e) {
          box.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
        }
      }

      async function sendChat() {
        const row = state.activeChat;
        const text = document.getElementById("chatInput").value.trim();
        if (!row || !text) return;
        try {
          await api(`/matches/${row.match_id}/messages`, {
            method: "POST",
            body: JSON.stringify({ sender_id: state.uid, message: text }),
          });
          document.getElementById("chatInput").value = "";
          await refreshMessages();
        } catch (e) {
          toast(e.message);
        }
      }

      async function loadMe() {
        if (!state.uid) return;
        try {
          const me = await api(`/users/${state.uid}`, { method: "GET" });
          document.getElementById("meNick").textContent = me.nickname;
          document.getElementById("meAvatar").textContent = initials(me.nickname);
          document.getElementById("meId").textContent = String(me.id);
          document.getElementById("meMail").textContent = localStorage.getItem("sm_mail") || "（端末にのみ保存）";
          const styles = { casual: "カジュアルに一杯", quiet: "落ち着いたお店", lively: "にぎやかなお店" };
          document.getElementById("meDrink").textContent = styles[me.drink_style] || me.drink_style;
        } catch (e) {
          toast(e.message);
        }
      }

      function escapeHtml(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      async function register() {
        const payload = {
          nickname: document.getElementById("regNick").value.trim(),
          email: document.getElementById("regMail").value.trim(),
          age: Number(document.getElementById("regAge").value),
          public_bio: document.getElementById("regBio").value.trim(),
          hobbies: document.getElementById("regHobby").value.split(",").map((x) => x.trim()).filter(Boolean),
          preferred_stations: document.getElementById("regSta").value.split(",").map((x) => x.trim()).filter(Boolean),
          drink_style: document.getElementById("regDrink").value,
        };
        if (payload.nickname.length < 2) return toast("ニックネームを入力してください");
        if (!payload.email) return toast("メールを入力してください");
        if (!payload.age || payload.age < 20) return toast("20歳以上のみ登録できます");
        try {
          const res = await api("/users", { method: "POST", body: JSON.stringify(payload) });
          state.uid = res.id;
          state.nickname = payload.nickname;
          localStorage.setItem(LS_UID, String(res.id));
          localStorage.setItem(LS_NICK, payload.nickname);
          localStorage.setItem("sm_mail", payload.email);
          toast("ようこそ！さっそくさがしてみましょう");
          renderStationFilters();
          navTo("discover");
        } catch (e) {
          toast(e.message);
        }
      }

      function resumeById() {
        const id = prompt("ユーザーID（数字）を入力してください");
        if (!id) return;
        const n = Number(id);
        if (!Number.isFinite(n)) return toast("数字のみ入力してください");
        state.uid = n;
        localStorage.setItem(LS_UID, String(n));
        toast("復帰しました");
        renderStationFilters();
        navTo("discover");
      }

      function boot() {
        document.getElementById("btnRegister").addEventListener("click", register);
        document.getElementById("btnResume").addEventListener("click", resumeById);
        document.querySelectorAll(".nav-btn").forEach((b) =>
          b.addEventListener("click", () => navTo(b.dataset.go)),
        );
        document.querySelectorAll(".tab").forEach((t) =>
          t.addEventListener("click", () => {
            connTab = t.dataset.tab;
            loadConnections();
          }),
        );
        document.getElementById("btnSendLike").addEventListener("click", sendInvite);
        document.getElementById("btnCloseSheet").addEventListener("click", closeSheets);
        document.getElementById("sheetBackdrop").addEventListener("click", closeSheets);
        document.getElementById("btnCloseChat").addEventListener("click", closeSheets);
        document.getElementById("btnSendChat").addEventListener("click", sendChat);
        document.getElementById("chatInput").addEventListener("keydown", (ev) => {
          if (ev.key === "Enter" && !ev.shiftKey) {
            ev.preventDefault();
            sendChat();
          }
        });
        document.getElementById("btnSafety").addEventListener("click", async () => {
          try {
            const pol = await api("/policy/safety", { method: "GET" });
            document.getElementById("policyBody").textContent = JSON.stringify(pol, null, 2);
            document.getElementById("sheetBackdrop").classList.add("show");
            document.getElementById("policySheet").classList.add("show");
          } catch (e) {
            toast(e.message);
          }
        });
        document.getElementById("btnClosePolicy").addEventListener("click", closeSheets);
        document.getElementById("btnLogout").addEventListener("click", () => {
          localStorage.removeItem(LS_UID);
          localStorage.removeItem(LS_NICK);
          localStorage.removeItem("sm_mail");
          state.uid = null;
          toast("ログアウトしました");
          showScreen("onboarding");
        });

        const saved = localStorage.getItem(LS_UID);
        if (saved) {
          state.uid = Number(saved);
          state.nickname = localStorage.getItem(LS_NICK) || "";
          renderStationFilters();
          navTo("discover");
        } else {
          showScreen("onboarding");
        }
      }

      boot();
    </script>
  </body>
</html>
