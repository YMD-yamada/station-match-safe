# 長期の「無料に近い」運用: Render の無料 Web のみ。
# DB は Render 付帯 Postgres（30日で期限切れ）を使わず、Neon 等の外部 URL を DATABASE_URL に渡す。
services:
  - type: web
    name: station-match-safe
    runtime: docker
    # Blueprint で省略すると既定が starter（有料）になるため明示する
    # https://render.com/docs/blueprint-spec
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOW_ORIGINS
        sync: false
      - key: API_RATE_LIMIT_PER_MIN
        value: "60"
